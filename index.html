<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen of My Heart — Women's Day Game 👑</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="hearts">
        <span>🌸</span>
        <span>💕</span>
        <span>🌹</span>
        <span>💗</span>
        <span>💐</span>
        <span>❤️</span>
        <span>🌷</span>
        <span>💖</span>
    </div>

    <div class="container hero">

        <div class="queen-badge">👑 Queen of My Heart 👑</div>

        <h1 class="arcade-title">Happy Women's Day,<br>Shorty!</h1>

        <p class="wday-tag">🌸 A special little arcade quest just for you 🌸</p>

        <p class="subtitle">
            Help me prove just how much you're loved…<br>
            You, me, and 10 questions straight from my heart 💕
        </p>

        <div class="btn-group">
<button class="btn-yes" onclick="location.href='intro.html'">START ▶</button>
            <button class="btn-no" id="noBtn">SKIP 🙃</button>
        </div>

        <div class="error-msg" id="errorMsg">
            ❌ Error 404: "Skip" not found.<br>
            You can ONLY choose <strong>START</strong> 💕
        </div>

        <p class="press-start">PRESS START TO PLAY →</p>

    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const errorMsg = document.getElementById('errorMsg');

        noBtn.addEventListener('click', function () {
            errorMsg.classList.add('show');

            // Restart the shake animation on every click
            noBtn.classList.remove('shake');
            void noBtn.offsetWidth;
            noBtn.classList.add('shake');
        });
    </script>

</body>
</html>
